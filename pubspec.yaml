name: mindbridge
description: "MindBridge — AI-powered mental wellness companion for students"
version: 1.0.0+1
publish_to: "none"

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ─── State Management ─────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ─── Navigation ───────────────────────────────────────
  go_router: ^13.2.0

  # ─── HTTP & Networking ────────────────────────────────
  dio: ^5.4.3+1
  http: ^1.2.2
  web_socket_channel: ^3.0.0

  # ─── Local Storage ────────────────────────────────────
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0
  hive_flutter: ^1.1.0

  # ─── UI & Animation ───────────────────────────────────
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1

  # ─── Charts & Data Visualization ─────────────────────
  fl_chart: ^0.68.0

  # ─── Icons ────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.7.0
  hugeicons: ^0.0.7
  lucide_flutter: ^0.575.0
  material_symbols_icons: ^4.2719.3

  # ─── Text & Markdown ──────────────────────────────────
  flutter_markdown: ^0.7.3
  google_fonts: ^6.2.1

  # ─── Date & Time ──────────────────────────────────────
  intl: ^0.19.0

  # ─── Utilities ────────────────────────────────────────
  uuid: ^4.4.0
  equatable: ^2.0.5
  collection: ^1.18.0
  flutter_dotenv: ^5.1.0

  # ─── Connectivity ─────────────────────────────────────
  connectivity_plus: ^5.0.2

  # ─── Permissions ──────────────────────────────────────
  permission_handler: ^11.3.1

  # ─── Notifications ────────────────────────────────────
  flutter_local_notifications: ^17.1.2

  # ─── Image Picker ─────────────────────────────────────
  image_picker: ^1.1.2

  # ─── URL Launcher ─────────────────────────────────────
  url_launcher: ^6.3.0

  # ─── Haptic ───────────────────────────────────────────
  haptic_feedback: ^0.1.0+1

  # ─── Blur / Glass ─────────────────────────────────────
  glass_kit: ^3.0.0

  # ─── Gamification & Progress ──────────────────────────
  confetti: ^0.7.0
  percent_indicator: ^4.2.3

  # ─── Calendar & Heatmap ───────────────────────────────
  table_calendar: ^3.1.2

  # ─── Timeline ─────────────────────────────────────────
  timeline_tile: ^2.0.0

  # ─── Supabase (Auth + Database) ───────────────────────
  supabase_flutter: ^2.8.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true

  assets:
    - .env

  # Assets loaded via google_fonts package (no local font files needed)
