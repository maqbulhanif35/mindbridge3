name: mindbridge_backend
description: MindBridge Backend API — Dart Frog + PostgreSQL
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  dart_frog: ^1.2.0
  dart_frog_web_socket: ^1.0.0
  postgres: ^3.3.4
  bcrypt: ^1.1.3
  jaguar_jwt: ^3.0.0
  dart_jsonwebtoken: ^2.9.0
  http: ^1.2.1
  json_annotation: ^4.9.0
  uuid: ^4.4.0
  crypto: ^3.0.5
  dotenv: ^4.2.0
  shelf_cors_headers: ^0.1.5
  mailer: ^6.2.1

dev_dependencies:
  dart_frog_cli: ^1.2.14
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  test: ^1.25.5
  mocktail: ^1.0.4
